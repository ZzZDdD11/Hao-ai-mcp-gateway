version: '3.9'

services:
  mysql:
    image: mysql:8.0.32
    container_name: mcp-gateway-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "12345678"
      MYSQL_DATABASE: ai_mcp_gateway_v2
    ports:
      - "3306:3306"
    volumes:
      - ./docs/dev-ops/mysql/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - mcp-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-gateway-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PARAMS: >-
        --spring.profiles.active=dev
        --spring.datasource.url=jdbc:mysql://mysql:3306/ai_mcp_gateway_v2
        --spring.datasource.username=root
        --spring.datasource.password=12345678
    ports:
      - "8080:8092"
    networks:
      - mcp-net

  nginx:
    image: nginx:alpine
    container_name: mcp-gateway-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docs/dev-ops/ngnix/html:/usr/share/nginx/html:ro
      - ./docs/dev-ops/ngnix/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge
